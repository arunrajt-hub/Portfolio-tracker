name: Portfolio News Tracker

on:
  schedule:
    - cron: "30 14 * * *"  # 8:00 PM IST (UTC+5:30)
  workflow_dispatch:        # allow manual trigger
    inputs:
      special_situations_days_back:
        description: "Special situations lookback window (days). Leave as 2 for normal daily runs."
        required: false
        default: "2"
      special_situations_max_enrich:
        description: "Max special situations to send through AI enrichment (summary/impact/view). Leave as 10 for normal daily runs — raise it for a one-off wide pull (e.g. with a 30-day lookback), but higher = slower + more Anthropic API cost."
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPECIAL_SITUATIONS_DAYS_BACK: ${{ github.event.inputs.special_situations_days_back || '2' }}
          SPECIAL_SITUATIONS_MAX_ENRICH: ${{ github.event.inputs.special_situations_max_enrich || '10' }}
        run: python main.py

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Update dashboard data ($(date -u +%Y-%m-%d))"
          git push
