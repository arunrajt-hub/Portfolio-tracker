name: Portfolio News Tracker

on:
  schedule:
    - cron: "30 14 * * *"  # 8:00 PM IST (UTC+5:30)
  workflow_dispatch:        # allow manual trigger
    inputs:
      special_situations_days_back:
        description: "Special situations lookback window (days). Leave as 1 for normal daily runs."
        required: false
        default: "1"

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_URL: ${{ secrets.WHAPI_URL }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPECIAL_SITUATIONS_DAYS_BACK: ${{ github.event.inputs.special_situations_days_back || '1' }}
        run: python main.py
